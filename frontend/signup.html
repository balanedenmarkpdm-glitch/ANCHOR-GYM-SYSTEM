<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ANCHOR - Sign Up</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="center-page">

    <div class="auth-card signup-card">

        <div class="logo">
            A
        </div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Create a customer account for the
            ANCHOR GYM SYSTEM.
        </p>


        <form id="signupForm">

            <div class="two-column">

                <div>

                    <label>
                        FIRST NAME
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Juan"
                        required
                    >

                </div>


                <div>

                    <label>
                        LAST NAME
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Cruz"
                        required
                    >

                </div>

            </div>


            <label>
                EMAIL ADDRESS
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="juan@gmail.com"
                required
            >


            <label>
                CONTACT NUMBER
            </label>

            <input
                type="text"
                id="signupPhone"
                placeholder="09XX XXX XXXX"
                required
            >


            <!-- PASSWORD -->

            <label>
                PASSWORD
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    required
                >

                <button
                    type="button"
                    id="toggleSignupPassword">
                    Show
                </button>

            </div>


            <!-- CONFIRM PASSWORD -->

            <label>
                CONFIRM PASSWORD
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="signupConfirm"
                    placeholder="Repeat password"
                    required
                >

                <button
                    type="button"
                    id="toggleSignupConfirm">
                    Show
                </button>

            </div>


            <label class="remember">

                <input
                    type="checkbox"
                    id="terms"
                >

                I agree to the terms and conditions.

            </label>


            <button
                type="submit"
                class="main-btn">

                Create Customer Account

            </button>

        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="login.html">
                Sign In
            </a>

        </p>


        <div class="info-box">

            Creating an account does
            <strong>NOT</strong> automatically
            create a gym membership.

            <br><br>

            Membership becomes active only after
            the ₱800 payment is verified and
            approved by the admin.

        </div>

    </div>

</div>


<script src="auth.js"></script>

</body>
</html>
