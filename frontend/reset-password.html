<!DOCTYPE html>
<html lang="en" data-portal="customer" data-page="forgot-password" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ANCHOR - Reset Password</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="portal-theme.css">
    <script src="portal-theme.js"></script>
</head>
<body>
    <main class="center-page">
        <section class="auth-card">
            <div class="logo" aria-hidden="true">A</div>
            <h2>Reset Your Password</h2>
            <p class="subtitle">Choose a new password for your ANCHOR customer account.</p>

            <form id="resetPasswordForm">
                <label for="resetPassword">NEW PASSWORD</label>
                <input
                    type="password"
                    id="resetPassword"
                    autocomplete="new-password"
                    minlength="6"
                    maxlength="72"
                    required
                >

                <label for="resetPasswordConfirm">CONFIRM NEW PASSWORD</label>
                <input
                    type="password"
                    id="resetPasswordConfirm"
                    autocomplete="new-password"
                    minlength="6"
                    maxlength="72"
                    required
                >

                <button type="submit" class="main-btn">Save New Password</button>
            </form>

            <p
                id="resetPasswordMessage"
                class="auth-message"
                role="status"
                aria-live="polite">
            </p>

            <p class="bottom-text">
                <a href="login.html">← Back to Login</a>
            </p>
        </section>
    </main>
    <script src="api-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
