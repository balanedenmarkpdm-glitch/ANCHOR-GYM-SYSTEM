<!DOCTYPE html>
<html lang="en" data-portal="customer" data-page="forgot-password" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ANCHOR - Reset Password</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="portal-theme.css">
    <script src="portal-theme.js"></script>
</head>
<body>
    <main class="center-page">
        <section class="auth-card">
            <div class="logo" aria-hidden="true">A</div>
            <h2>Enter Your Reset Code</h2>
            <p class="subtitle">If an ANCHOR customer account uses <strong id="resetRecipient"></strong>, a 4-digit code will be sent. Check your inbox and spam folder. Codes expire in 30 minutes.</p>

            <form id="verifyResetCodeForm">
                <label for="resetCodeDigit1">4-DIGIT VERIFICATION CODE</label>
                <div class="verification-code-control">
                    <div
                        id="resetCodeInputs"
                        class="verification-code-inputs"
                        role="group"
                        aria-label="4-digit verification code">
                        <input id="resetCodeDigit1" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="4" aria-label="Digit 1 of 4" required>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2 of 4" required>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3 of 4" required>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4 of 4" required>
                    </div>

                    <button type="submit" class="main-btn">Verify Code</button>
                    <button type="button" id="resendResetCode" class="main-btn secondary-btn">Resend Code</button>
                </div>
            </form>

            <form id="resetPasswordForm" hidden>
                <label for="resetPassword">NEW PASSWORD</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="resetPassword"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="72"
                        required
                    >
                    <button
                        type="button"
                        id="toggleResetPassword"
                        class="password-visibility-toggle"
                        aria-label="Show password"
                        aria-pressed="false">
                        <svg
                            class="password-visibility-icon"
                            data-password-icon="show"
                            viewBox="0 0 24 24"
                            aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg
                            class="password-visibility-icon"
                            data-password-icon="hide"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            hidden>
                            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.9M6.2 6.2A15.8 15.8 0 0 0 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path>
                        </svg>
                    </button>
                </div>

                <label for="resetPasswordConfirm">CONFIRM NEW PASSWORD</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="resetPasswordConfirm"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="72"
                        required
                    >
                    <button
                        type="button"
                        id="toggleResetPasswordConfirm"
                        class="password-visibility-toggle"
                        aria-label="Show password"
                        aria-pressed="false">
                        <svg
                            class="password-visibility-icon"
                            data-password-icon="show"
                            viewBox="0 0 24 24"
                            aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg
                            class="password-visibility-icon"
                            data-password-icon="hide"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            hidden>
                            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.9M6.2 6.2A15.8 15.8 0 0 0 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="main-btn">Save New Password</button>
            </form>

            <p
                id="resetPasswordMessage"
                class="auth-message"
                role="status"
                aria-live="polite">
            </p>

            <p id="requestNewResetCode" class="bottom-text" hidden>
                <a href="forgot-password.html">Request a new code</a>
            </p>

            <p class="bottom-text">
                <a href="login.html">← Back to Login</a>
            </p>
        </section>
    </main>
    <script src="api-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
