<!DOCTYPE html>
<html lang="en" data-portal="customer" data-page="forgot-password" data-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ANCHOR - Forgot Password</title>

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="portal-theme.css">

</head>

<body>

<div class="center-page">

    <div class="auth-card">

        <div class="logo">
            A
        </div>


        <h2>
            Forgot Password?
        </h2>


        <p class="subtitle">

            Enter the email connected to your
            ANCHOR customer account.

        </p>


        <form id="forgotForm">

            <label for="forgotEmail">
                EMAIL ADDRESS
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="juan@gmail.com"
                required
            >


            <button
                type="submit"
                class="main-btn">

                Send Reset Link

            </button>

        </form>


        <p class="bottom-text">

            <a href="login.html">
                ← Back to Login
            </a>

        </p>

    </div>

</div>

<script src="portal-theme.js"></script>
<script src="api-config.js"></script>
<script src="auth.js"></script>

</body>
</html>
