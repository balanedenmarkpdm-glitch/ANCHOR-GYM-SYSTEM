<!DOCTYPE html>
<html lang="en" data-portal="admin" data-page="admin-login" data-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ANCHOR - Admin Login</title>

    <link rel="stylesheet"
          href="auth.css">

    <link rel="stylesheet"
          href="portal-theme.css">

</head>

<body>

<div class="center-page">

    <div class="auth-card">

        <div class="logo">
            A
        </div>


        <span class="restricted">
            ADMIN / STAFF ONLY
        </span>


        <h2>
            Restricted Access
        </h2>


        <p class="subtitle">

            Authorized ANCHOR administrators
            and staff only.

        </p>


        <div class="warning admin-login-warning">

            This area is restricted.

            <br><br>

            There is no public administrator
            registration.

        </div>


        <form id="adminLoginForm">


            <!-- EMAIL -->

            <label for="adminEmail">
                ADMIN / STAFF EMAIL
            </label>

            <input
                type="email"
                id="adminEmail"
                value="admin@gmail.com"
                autocomplete="username"
                required
            >


            <!-- PASSWORD -->

            <label for="adminPassword">
                PASSWORD
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="adminPassword"
                    value="admin123"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    id="toggleAdminPassword"
                    class="password-visibility-toggle"
                    aria-controls="adminPassword"
                    aria-label="Show password"
                    aria-pressed="false">
                    <svg
                        class="password-visibility-icon"
                        data-password-icon="show"
                        viewBox="0 0 24 24"
                        aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg
                        class="password-visibility-icon"
                        data-password-icon="hide"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        hidden>
                        <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"></path>
                    </svg>

                </button>

            </div>


            <!-- REMEMBER -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="adminRememberMe">

                    Keep me signed in

                </label>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="main-btn">

                Admin / Staff Sign In

            </button>


        </form>


        <p
            id="adminLoginError"
            class="admin-login-error">
        </p>


        <p class="bottom-text">

            <a href="login.html">

                ← Customer Login

            </a>

        </p>

    </div>

</div>


<script src="portal-theme.js"></script>
<script src="api-config.js"></script>
<script src="auth.js"></script>

</body>

</html>
